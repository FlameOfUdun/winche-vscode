name: Publish

on:
  push:
    tags:
      - 'v*'

# Trusted publishing: both registries take this workflow's OIDC token (no stored access tokens).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: npm ci

      - name: The tag matches package.json's version
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version"; exit 1; }

      - run: npm test

      # One package, published to both registries.
      - run: npx vsce package --out winche.vsix

      - name: Publish to the VS Code Marketplace
        run: npx vsce publish --oidc --packagePath winche.vsix

      - name: Publish to Open VSX (Cursor, VSCodium, …)
        run: npx ovsx publish winche.vsix --trusted-publishing
